services:
  frontend:
    
    container_name: frontend
    ports:
      - "8080:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    build:
      context: ./frontend
      dockerfile: Dockerfile

  db:
    image: mysql:8.0
    container_name: etodo
    environment:
      MYSQL_ROOT_PASSWORD: my_password
      MYSQL_DATABASE: etodo
      MYSQL_USER: test
      MYSQL_PASSWORD: testpass
    ports:
      - "3306:3306"
    volumes:
      - ./datas:/docker-entrypoint-initdb.d
      - ./db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_USER: test
      MYSQL_ROOT_PASSWORD: testpass
    ports:
      - "8000:80"
    depends_on:
      - db

volumes:
  db_data:
    driver: local